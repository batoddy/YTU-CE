{% extends 'base.html' %}
{% block title %}Kategori Sil{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white"><i class="bi bi-exclamation-triangle"></i> Silme Onayı</div>
            <div class="card-body text-center">
                <h5>{{ category.name }}</h5>
                <p class="text-muted">Bu kategoriyi silmek istediğinizden emin misiniz?</p>
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Evet, Sil</button>
                    <a href="{% url 'category_list' %}" class="btn btn-secondary">İptal</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
