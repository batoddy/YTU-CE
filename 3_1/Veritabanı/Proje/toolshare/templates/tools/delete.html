{% extends 'base.html' %}
{% block title %}Alet Sil - ToolShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle"></i> Silme Onayı
            </div>
            <div class="card-body text-center">
                <i class="bi bi-trash display-1 text-danger"></i>
                <h5 class="mt-3">{{ tool.name }}</h5>
                <p class="text-muted">Bu aleti silmek istediğinizden emin misiniz?</p>
                <p class="small text-danger">Bu işlem geri alınamaz!</p>
                
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Evet, Sil
                    </button>
                    <a href="{% url 'tool_list' %}" class="btn btn-secondary">İptal</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
