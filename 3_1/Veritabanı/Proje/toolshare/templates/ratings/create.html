{% extends 'base.html' %}
{% block title %}Değerlendirme{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="bi bi-star"></i> Değerlendirme</div>
            <div class="card-body">
                <p><strong>Alet:</strong> {{ reservation.tool.name }}</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Puan</label>
                        <select name="score" class="form-select" required>
                            <option value="5">Saglam teslim aldim (5)</option>
                            <option value="1">Kirildi/bozuk teslim edildi (1)</option>
                        </select>
                        <div class="form-text">
                            Gec teslimlerde "saglam" secenegi otomatik 3 puan olarak kaydedilir.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Yorum</label>
                        <textarea name="comment" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Gönder</button>
                    <a href="{% url 'reservation_list' %}" class="btn btn-secondary">İptal</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
